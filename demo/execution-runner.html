<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KT6 GUI Execution Runner</title>
    <style>
      :root {
        font-family: Inter, "Microsoft YaHei", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }
      body { margin: 0; padding: 28px; }
      main { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
      .card { background: white; border: 1px solid #dce3ef; border-radius: 14px; padding: 22px; box-shadow: 0 8px 26px rgba(31, 49, 79, .07); }
      .form { display: grid; gap: 14px; }
      label { display: grid; gap: 7px; font-weight: 700; }
      input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #b9c5d8; border-radius: 8px; padding: 11px 13px; font: inherit; }
      textarea { min-height: 90px; resize: vertical; }
      button { border: 0; border-radius: 8px; padding: 10px 17px; background: #246bfd; color: white; font-weight: 700; cursor: pointer; }
      button.secondary { color: #244266; background: #e9eff8; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .workspace { display: grid; grid-template-columns: minmax(260px, .8fr) minmax(420px, 1.25fr) minmax(260px, .8fr); gap: 18px; }
      ol { padding-left: 24px; }
      li { margin: 10px 0; }
      .done { color: #14805e; }
      .running { color: #246bfd; font-weight: 700; }
      img { width: 100%; min-height: 240px; object-fit: contain; border: 1px solid #dce3ef; border-radius: 9px; background: #f8fafc; }
      pre { overflow: auto; max-height: 440px; padding: 14px; border-radius: 8px; background: #111827; color: #e5edf8; white-space: pre-wrap; }
      .muted { color: #66758d; }
      .error { color: #b42318; font-weight: 700; }
      [hidden] { display: none !important; }
      @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>KT6 GUI Execution Runner</h1>
        <div class="form">
          <label>目标网页
            <input id="start-url" placeholder="https://approved-test-host/path" />
          </label>
          <label>你想完成什么？
            <textarea id="user-request" placeholder="例如：打开 AP_001 的详情并进入拓扑"></textarea>
          </label>
          <div class="actions">
            <button id="generate">生成计划</button>
            <button id="show-json" class="secondary" disabled>查看 JSON</button>
            <button id="execute" disabled>确认并开始执行</button>
          </div>
          <div id="message" class="muted">计划生成不会操作页面，只有确认后才开始执行。</div>
        </div>
      </section>

      <section id="workspace" class="workspace" hidden>
        <article class="card">
          <h2>Action Plan</h2>
          <ol id="plan-steps"></ol>
        </article>
        <article class="card">
          <h2>Current Page</h2>
          <img id="preview" alt="最新真实页面截图" />
          <p id="capture" class="muted">尚未采集</p>
        </article>
        <article class="card">
          <h2>Step Detail</h2>
          <dl>
            <dt>状态</dt><dd id="run-status">等待确认</dd>
            <dt>当前步骤</dt><dd id="current-step">-</dd>
            <dt>UI Graph</dt><dd id="graph-id">-</dd>
          </dl>
        </article>
      </section>
      <pre id="json-view" hidden></pre>
    </main>

    <script>
      const state = { generated: null, runId: "", timer: null };
      const byId = (id) => document.getElementById(id);

      async function api(path, options = {}) {
        const response = await fetch(path, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      }

      function message(text, error = false) {
        byId("message").textContent = text;
        byId("message").className = error ? "error" : "muted";
      }

      function renderPlan() {
        const list = byId("plan-steps");
        list.replaceChildren();
        state.generated.readable_steps.forEach((text, index) => {
          const item = document.createElement("li");
          item.dataset.step = `step-${index + 1}`;
          item.textContent = text;
          list.appendChild(item);
        });
        byId("workspace").hidden = false;
        byId("show-json").disabled = false;
        byId("execute").disabled = !state.generated.runner_configured;
        if (state.generated.planning_preview) byId("preview").src = state.generated.planning_preview;
        byId("capture").textContent = state.generated.planning_capture_id
          ? `planning capture: ${state.generated.planning_capture_id}`
          : "尚未采集";
        byId("graph-id").textContent = state.generated.planning_graph_id || "-";
      }

      async function generate() {
        message("正在感知目标页面并调用规划模型……");
        try {
          state.generated = await api("/api/execution/plans", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              start_url: byId("start-url").value,
              user_request: byId("user-request").value,
            }),
          });
          renderPlan();
          message(state.generated.runner_configured ? "计划已生成，请确认后执行。" : "计划已生成，但浏览器执行环境未配置。");
        } catch (error) {
          message(`计划生成失败：${error.message}`, true);
        }
      }

      async function execute() {
        byId("execute").disabled = true;
        message("已确认计划，正在启动真实页面执行……");
        try {
          const run = await api("/api/execution/runs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ plan: state.generated.plan, confirmed: true }),
          });
          state.runId = run.run_id;
          await poll();
        } catch (error) {
          message(`执行启动失败：${error.message}`, true);
          byId("execute").disabled = false;
        }
      }

      async function poll() {
        try {
          const run = await api(`/api/execution/runs/${state.runId}`);
          byId("run-status").textContent = run.status;
          byId("current-step").textContent = run.current_step || "-";
          byId("graph-id").textContent = run.graph_id || "-";
          byId("capture").textContent = run.capture_id ? `capture: ${run.capture_id}` : "尚未采集";
          if (run.latest_preview) byId("preview").src = run.latest_preview;
          document.querySelectorAll("#plan-steps li").forEach((item, index) => {
            item.className = index < run.steps.length ? "done" : (index + 1 === run.current_step_index ? "running" : "");
          });
          if (run.status === "success") {
            message("执行完成：SUCCESS");
            return;
          }
          if (run.status === "failed") {
            message(`执行失败：${run.error_code}`, true);
            byId("execute").disabled = false;
            return;
          }
          state.timer = setTimeout(poll, 500);
        } catch (error) {
          message(`状态查询失败：${error.message}`, true);
        }
      }

      byId("generate").addEventListener("click", generate);
      byId("execute").addEventListener("click", execute);
      byId("show-json").addEventListener("click", () => {
        const view = byId("json-view");
        view.hidden = !view.hidden;
        view.textContent = JSON.stringify(state.generated.plan, null, 2);
      });
    </script>
  </body>
</html>
